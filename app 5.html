<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Salt-Adulteration Colour-Detection</title>
  <!-- Bootstrap for responsive UI -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-GwQogHx8uGvfJc1LRbJReaFB3+1wMFp4kI4SnXcN0xi/YJN5IDK4Qn6XQpGhTygX"
    crossorigin="anonymous"
  >
  <style>
    body { background:#f8f9fa; }
    .swatch {
      width:40px; height:40px;
      border:1px solid #ddd;
      display:inline-block;
      vertical-align:middle;
      margin-left:.5rem;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">Salt-Adulteration Colour-Detection</h1>

    <!-- 1) Calibration Mode -->
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        Calibration (Step 1 of 2)
      </div>
      <div class="card-body">
        <div class="form-group">
          <label><strong>Pure Milk Strip:</strong></label>
          <input
            id="pureImg"
            type="file"
            accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff,.heic,.heif,image/*"
            class="form-control-file"
            required
          >
        </div>
        <div class="form-group">
          <label><strong>Adulterated Strip:</strong></label>
          <input
            id="saltImg"
            type="file"
            accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff,.heic,.heif,image/*"
            class="form-control-file"
            required
          >
        </div>
        <button id="btnCal" class="btn btn-primary">Save Calibration & Enable Testing</button>
      </div>
    </div>

    <!-- 2) Testing Mode (locked until calibration) -->
    <div class="card mb-4" id="testingCard" style="opacity:.5; pointer-events:none">
      <div class="card-header bg-success text-white">
        Testing (Step 2 of 2)
      </div>
      <div class="card-body">
        <div class="form-group">
          <label>Capture/Test Strip:</label>
          <input
            id="testImg"
            type="file"
            accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff,.heic,.heif,image/*"
            capture="environment"
            class="form-control-file"
          >
        </div>
        <div id="testResult" class="mt-3"></div>
      </div>
    </div>

    <!-- 3) Export Results -->
    <div class="card">
      <div class="card-header bg-info text-white">
        Export & Reporting
      </div>
      <div class="card-body text-right">
        <button id="btnExport" class="btn btn-info">Download Test Results CSV</button>
      </div>
    </div>
  </div>

  <script>
  // — UTILS: RGB→HSV & Grey-World white-balance
  function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255;
    let mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, s=mx?d/mx:0, v=mx;
    if(d){
      switch(mx){
        case r: h=((g-b)/d + (g<b?6:0)); break;
        case g: h=((b-r)/d + 2); break;
        case b: h=((r-g)/d + 4); break;
      }
      h/=6;
    }
    return [h*360,s,v];
  }
  function whiteBalance(pix){
    let sum=[0,0,0], len=pix.length/4;
    for(let i=0;i<pix.length;i+=4){
      sum[0]+=pix[i]; sum[1]+=pix[i+1]; sum[2]+=pix[i+2];
    }
    let avg=sum.map(x=>x/len), gray=(avg[0]+avg[1]+avg[2])/3;
    let gain=avg.map(x=>gray/x);
    for(let i=0;i<pix.length;i+=4){
      pix[i]=Math.min(255,pix[i]*gain[0]);
      pix[i+1]=Math.min(255,pix[i+1]*gain[1]);
      pix[i+2]=Math.min(255,pix[i+2]*gain[2]);
    }
  }
  function computeAvgHs(img, cb){
    let c=document.createElement('canvas'), ctx=c.getContext('2d');
    c.width=img.width; c.height=img.height;
    ctx.drawImage(img,0,0);
    let data=ctx.getImageData(0,0,c.width,c.height).data;
    whiteBalance(data);
    let sumH=0, sumS=0, cnt=0;
    for(let i=0;i<data.length;i+=4){
      let [h,s]=rgbToHsv(data[i],data[i+1],data[i+2]);
      sumH+=h; sumS+=s; cnt++;
    }
    cb(sumH/cnt, sumS/cnt);
  }

  // — STORAGE for one pure & one salt profile
  function saveCal(pure, salt){
    localStorage.setItem('calPure', JSON.stringify(pure));
    localStorage.setItem('calSalt', JSON.stringify(salt));
  }
  function getCal(){
    let p=JSON.parse(localStorage.getItem('calPure')||'null'),
        s=JSON.parse(localStorage.getItem('calSalt')||'null');
    return p&&s ? {p,s} : null;
  }
  function unlockTest(){
    document.getElementById('testingCard').style.opacity=1;
    document.getElementById('testingCard').style.pointerEvents='auto';
  }

  // — CALIBRATION HANDLER
  document.getElementById('btnCal').onclick = ()=>{
    let fP=document.getElementById('pureImg').files[0],
        fS=document.getElementById('saltImg').files[0];
    if(!fP||!fS) return alert('Upload BOTH reference images first.');
    let imgP=new Image(), imgS=new Image(), done=0, store={};
    function checkDone(){
      if(++done===2){
        saveCal(store.p, store.s);
        unlockTest();
        alert('✅ Calibration saved.');
      }
    }
    imgP.onload = ()=> computeAvgHs(imgP,(h,s)=>{ store.p={h,s}; checkDone(); });
    imgS.onload = ()=> computeAvgHs(imgS,(h,s)=>{ store.s={h,s}; checkDone(); });
    imgP.src=URL.createObjectURL(fP);
    imgS.src=URL.createObjectURL(fS);
  };

  // — TESTING HANDLER
  let results=[];
  document.getElementById('testImg').onchange = e=>{
    let f=e.target.files[0];
    if(!f) return;
    let img=new Image();
    img.onload = ()=>{
      let cal=getCal();
      if(!cal) return alert('Calibrate first.');
      computeAvgHs(img,(h,s)=>{
        let dp=Math.hypot(cal.p.h-h, cal.p.s-s),
            ds=Math.hypot(cal.s.h-h, cal.s.s-s),
            pure=dp<ds, conf=Math.abs(dp-ds)/(dp+ds);
        document.getElementById('testResult').innerHTML=`
          <h5>Result: 
            <span class="text-${pure?'success':'danger'}">
              ${pure?'PASS':'FAIL'}
            </span>
          </h5>
          <p>
            Classification: ${pure?'Pure':'Adulterated'}<br>
            Confidence: ${(conf*100).toFixed(1)}%<br>
            Detected Color:
            <span class="swatch" style="background:hsl(${h},${(s*100)}%,50%)"></span>
          </p>`;
        results.push({
          time: new Date().toISOString(),
          hue: h.toFixed(1), sat: s.toFixed(3),
          class: pure?'Pure':'Adulterated',
          conf: conf.toFixed(3)
        });
      });
    };
    img.src = URL.createObjectURL(f);
  };

  // — EXPORT CSV
  document.getElementById('btnExport').onclick = ()=>{
    if(!results.length) return alert('No test data yet.');
    let lines = ['DateTime,Hue,Sat,Class,Confidence'];
    results.forEach(r=>{
      lines.push([r.time,r.hue,r.sat,r.class,r.conf].join(','));
    });
    let blob = new Blob([lines.join('\n')], {type:'text/csv'});
    let url  = URL.createObjectURL(blob),
        a    = document.createElement('a');
    a.href = url; a.download = 'test_results.csv'; a.click();
    URL.revokeObjectURL(url);
  };

  // unlock if already calibrated
  if(getCal()) unlockTest();
  </script>
</body>
</html>
