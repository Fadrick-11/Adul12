<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- PWA meta for standalone on iOS/Android -->
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">
  <title>Everest Secura Test</title>

  <!-- Bootstrap for quick styling -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <style>
    body { padding-top: 56px; background: #f8f9fa; }
    .swatch { width:40px; height:40px; border:1px solid #ddd; border-radius:4px; display:inline-block; vertical-align:middle; margin-right:.5rem; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Everest Secura Test</span>
    </div>
  </nav>

  <!-- Content -->
  <div class="container py-4">
    <div class="card mb-4">
      <div class="card-header">Calibration (Step 1)</div>
      <div class="card-body">
        <input id="pureImg" type="file" accept="image/*" class="form-control mb-2" />
        <input id="saltImg" type="file" accept="image/*" class="form-control mb-2" />
        <button id="btnCal" class="btn btn-primary w-100">Save Calibration</button>
      </div>
    </div>

    <div class="card mb-4" id="testingCard" style="opacity:.5;pointer-events:none">
      <div class="card-header">Testing (Step 2)</div>
      <div class="card-body">
        <input id="testImg" type="file" accept="image/*" capture="environment" class="form-control" />
        <div id="result" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- Service‐worker registration & JS logic -->
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  // Simple RGB→HSV + gray-world + average Hue/Sat classifier
  function rgbToHsv(r,g,b){ r/=255;g/=255; b/=255;
    let mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, s=mx?d/mx:0, v=mx;
    if(d){ switch(mx){
      case r: h=((g-b)/d + (g<b?6:0)); break;
      case g: h=((b-r)/d + 2); break;
      case b: h=((r-g)/d + 4); break;
    } h/=6; }
    return [h*360,s,v];
  }
  function whiteBalance(pixels){
    let sum=[0,0,0], n=pixels.length/4;
    for(let i=0;i<pixels.length;i+=4){
      sum[0]+=pixels[i]; sum[1]+=pixels[i+1]; sum[2]+=pixels[i+2];
    }
    let avg=sum.map(x=>x/n), gray=(avg[0]+avg[1]+avg[2])/3,
        gains=avg.map(x=>gray/x);
    for(let i=0;i<pixels.length;i+=4){
      pixels[i]*=gains[0]; pixels[i+1]*=gains[1]; pixels[i+2]*=gains[2];
    }
  }
  function computeProfile(file, cb){
    let img=new Image();
    img.onload = ()=>{
      let c=document.createElement('canvas'), ctx=c.getContext('2d');
      c.width=img.width; c.height=img.height;
      ctx.drawImage(img,0,0);
      let data=ctx.getImageData(0,0,c.width,c.height).data;
      whiteBalance(data);
      let hSum=0,sSum=0,count=0;
      for(let i=0;i<data.length;i+=4){
        let [h,s]=rgbToHsv(data[i],data[i+1],data[i+2]);
        hSum+=h; sSum+=s; count++;
      }
      cb({h:hSum/count, s:sSum/count});
    };
    img.src=URL.createObjectURL(file);
  }

  let calib;
  document.getElementById('btnCal').onclick = ()=>{
    let p=document.getElementById('pureImg').files[0],
        s=document.getElementById('saltImg').files[0];
    if(!p||!s) return alert('Upload both reference images.');
    computeProfile(p, pure=>{
      computeProfile(s, salt=>{
        calib={pure,salt};
        localStorage.setItem('calib', JSON.stringify(calib));
        let t=document.getElementById('testingCard');
        t.style.opacity=1; t.style.pointerEvents='auto';
        alert('Calibration saved—proceed to testing.');
      });
    });
  };

  // load existing calibration
  window.addEventListener('load',()=>{
    let stored=localStorage.getItem('calib');
    if(stored){ calib=JSON.parse(stored);
      let t=document.getElementById('testingCard');
      t.style.opacity=1; t.style.pointerEvents='auto';
    }
  });

  document.getElementById('testImg').onchange = e=>{
    let f=e.target.files[0];
    if(!f||!calib) return;
    computeProfile(f, test=>{
      let dPure=Math.hypot(test.h-calib.pure.h,test.s-calib.pure.s),
          dSalt=Math.hypot(test.h-calib.salt.h,test.s-calib.salt.s),
          isPure=dPure<dSalt,
          conf=Math.abs(dSalt-dPure)/(dSalt+dPure);
      document.getElementById('result').innerHTML = `
        <h5>Result: <span class="text-${isPure?'success':'danger'}">
          ${isPure?'PASS':'FAIL'}
        </span></h5>
        <p>Confidence: ${(conf*100).toFixed(1)}%</p>
      `;
    });
  };
  </script>

</body>
</html>
