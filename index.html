<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Everest Secura Test</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

  <!-- Cropper.js -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <!-- PDF libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.5.3/jspdf.debug.js"></script>

  <style>
    body { padding-top:140px; background:#f8f9fa; }
    .logo-bar { position:fixed; top:0; left:0; right:0; background:#fff;
      padding:8px 0; text-align:center; border-bottom:1px solid #ddd; z-index:1100; }
    .logo-bar embed { width:200px; height:60px; }
    .thumb-container { position:relative; display:inline-block; margin:4px; }
    .thumb { width:60px; height:60px; object-fit:cover; border:1px solid #ccc; border-radius:4px; }
    .thumb-remove { position:absolute; top:-6px; right:-6px; background:#dc3545; color:#fff;
      border:none; border-radius:50%; width:20px; height:20px; font-size:12px; line-height:18px;
      cursor:pointer; }
    .tab-content { margin-top:20px; }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo-bar">
    <embed src="Everest Logo.pdf" type="application/pdf">
  </div>

  <div class="container">

    <!-- Tabs -->
    <ul class="nav nav-tabs fixed-top" style="top:80px; background:#fff; z-index:1090;">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#calTab">
          <i class="fas fa-sliders-h me-1"></i>Calibration
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#analysisTab">
          <i class="fas fa-vial me-1"></i>Analysis
        </button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- Calibration Tab -->
      <div class="tab-pane fade show active" id="calTab">
        <div class="card mb-4 mt-4">
          <div class="card-header">Step 1: Calibration (min 4 references)</div>
          <div class="card-body">

            <!-- Pure refs -->
            <div class="mb-3">
              <label><strong>Pure Reference Strips</strong></label><br>
              <button id="btnPureCam" class="btn btn-outline-primary btn-sm me-2">
                <i class="fas fa-camera"></i> Capture
              </button>
              <button id="btnPureGal" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-image"></i> Gallery
              </button>
              Count: <strong id="pureCount">0</strong>
              <div id="pureList" class="mt-2"></div>
              <input id="pureCam" type="file" accept="image/*" capture="environment" hidden>
              <input id="pureGal" type="file" accept="image/*" hidden>
            </div>

            <!-- Adulterated refs -->
            <div class="mb-3">
              <label><strong>Adulterated Reference Strips</strong></label><br>
              <button id="btnSaltCam" class="btn btn-outline-primary btn-sm me-2">
                <i class="fas fa-camera"></i> Capture
              </button>
              <button id="btnSaltGal" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-image"></i> Gallery
              </button>
              Count: <strong id="saltCount">0</strong>
              <div id="saltList" class="mt-2"></div>
              <input id="saltCam" type="file" accept="image/*" capture="environment" hidden>
              <input id="saltGal" type="file" accept="image/*" hidden>
            </div>

            <button id="btnCal" class="btn btn-primary w-100" disabled>
              Save Calibration
            </button>
          </div>
        </div>
      </div>

      <!-- Analysis Tab -->
      <div class="tab-pane fade" id="analysisTab">
        <div class="card mb-4 mt-4">
          <div class="card-header">Step 2: Analysis</div>
          <div class="card-body">
            <div class="mb-3">
              <label>Test Name (optional)</label>
              <input id="testName" type="text" class="form-control" placeholder="Sample A">
            </div>
            <button id="btnPickTest" class="btn btn-outline-primary w-100 mb-3">
              <i class="fas fa-camera me-1"></i> Pick/Capture Strip
            </button>
            <input id="testImg" type="file" accept="image/*" capture="environment" hidden>
            <div id="result"></div>
            <button id="btnPDF" class="btn btn-secondary w-100 mt-3" style="display:none">
              <i class="fas fa-file-pdf me-1"></i> Generate PDF
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Cropper Modal -->
  <div class="modal fade" id="cropModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crop Reference Strip</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img id="cropImage" style="max-width:100%; display:block; margin:auto">
        </div>
        <div class="modal-footer">
          <button id="btnCrop" class="btn btn-primary">Crop & Use</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  // Register SW
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  // Color utils
  function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255;
    let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0,s=mx?d/mx:0;
    if(d){ switch(mx){
      case r: h=((g-b)/d+(g<b?6:0)); break;
      case g: h=((b-r)/d+2); break;
      case b: h=((r-g)/d+4); break;
    } h/=6; }
    return [h*360,s];
  }
  function whiteBalance(data){
    const sum=[0,0,0],n=data.length/4;
    for(let i=0;i<data.length;i+=4){
      sum[0]+=data[i]; sum[1]+=data[i+1]; sum[2]+=data[i+2];
    }
    const avg=sum.map(x=>x/n), gray=(avg[0]+avg[1]+avg[2])/3,
          gains=avg.map(x=>gray/x);
    for(let i=0;i<data.length;i+=4){
      data[i]*=gains[0]; data[i+1]*=gains[1]; data[i+2]*=gains[2];
    }
  }
  function computeProfile(canvas, cb){
    const ctx = canvas.getContext('2d'),
          data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    whiteBalance(data);
    let hSum=0,sSum=0,c=0;
    for(let i=0;i<data.length;i+=4){
      const [h,s]=rgbToHsv(data[i],data[i+1],data[i+2]);
      hSum+=h; sSum+=s; c++;
    }
    cb({h:hSum/c, s:sSum/c});
  }

  // State
  const pureRefs=[], saltRefs=[];
  let calib=null, cropper, currentType;

  // UI update
  function updateUI(){
    ['pure','salt'].forEach(type=>{
      const list = document.getElementById(type+'List'),
            arr  = type==='pure'?pureRefs:saltRefs;
      list.innerHTML='';
      arr.forEach((ref, i)=>{
        const d=document.createElement('div');
        d.className='thumb-container';
        d.innerHTML=`
          <img src="${URL.createObjectURL(ref.file)}" class="thumb">
          <button class="thumb-remove" data-type="${type}" data-idx="${i}">&times;</button>`;
        list.appendChild(d);
      });
      document.getElementById(type+'Count').textContent = arr.length;
    });
    document.getElementById('btnCal').disabled =
      (pureRefs.length + saltRefs.length) < 4;
  }

  // Remove thumbnail
  document.body.addEventListener('click', e=>{
    if(e.target.classList.contains('thumb-remove')){
      const t=e.target.dataset.type, i=+e.target.dataset.idx;
      (t==='pure'?pureRefs:saltRefs).splice(i,1);
      updateUI();
    }
  });

  // Hook up calibration inputs with cropping
  ['PureCam','PureGal','SaltCam','SaltGal'].forEach(key=>{
    const type = key.startsWith('Pure')?'pure':'salt',
          inp  = document.getElementById(key.charAt(0).toLowerCase()+key.slice(1)),
          btn  = document.getElementById('btn'+key);
    btn.onclick = ()=> inp.click();
    inp.onchange = e=>{
      const file=e.target.files[0]; if(!file) return;
      currentType = type;
      const img = document.getElementById('cropImage');
      img.src = URL.createObjectURL(file);
      const modal = new bootstrap.Modal(document.getElementById('cropModal'));
      modal.show();
      document.getElementById('cropModal').addEventListener('shown.bs.modal', ()=>{
        cropper && cropper.destroy();
        cropper = new Cropper(img,{viewMode:1,autoCropArea:1});
      },{once:true});
    };
  });

  // Crop & use
  document.getElementById('btnCrop').onclick = ()=>{
    const canvas = cropper.getCroppedCanvas();
    computeProfile(canvas, prof=>{
      // convert canvas to File
      const d = canvas.toDataURL('image/png'),
            arr = d.split(','), mime = arr[0].match(/:(.*?);/)[1],
            bin = atob(arr[1]), u8=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      const file = new File([u8],'crop.png',{type:mime});
      if(currentType==='pure') pureRefs.push({file,profile:prof});
      else                saltRefs.push({file,profile:prof});
      updateUI();
      bootstrap.Modal.getInstance(document.getElementById('cropModal')).hide();
    });
  };

  // Calibration save
  document.getElementById('btnCal').onclick = ()=>{
    const avg = arr=>arr.reduce((a,c)=>({h:a.h+c.profile.h,s:a.s+c.profile.s}),{h:0,s:0});
    const pA=avg(pureRefs), sA=avg(saltRefs);
    calib = {
      pure: {h:pA.h/pureRefs.length, s:pA.s/pureRefs.length},
      salt: {h:sA.h/saltRefs.length, s:sA.s/saltRefs.length}
    };
    localStorage.setItem('calib', JSON.stringify(calib));
    alert('Calibration saved. Switch to Analysis tab.');
  };

  // Restore
  window.addEventListener('load', ()=>{
    const st = localStorage.getItem('calib');
    if(st) calib = JSON.parse(st);
    updateUI();
  });

  // Analysis: button to pick test image
  document.getElementById('btnPickTest').onclick = ()=>{
    document.getElementById('testImg').click();
  };
  document.getElementById('testImg').onchange = e=>{
    const f=e.target.files[0]; if(!f||!calib) return;
    const name=document.getElementById('testName').value.trim()||'—';
    const img=new Image();
    img.onload=()=>{
      const full=document.createElement('canvas'),
            fctx=full.getContext('2d');
      full.width=img.width; full.height=img.height;
      fctx.drawImage(img,0,0);
      const regs=[
        {x:0,y:0,w:img.width/2,h:img.height/2},
        {x:img.width/2,y:0,w:img.width/2,h:img.height/2},
        {x:0,y:img.height/2,w:img.width/2,h:img.height/2},
        {x:img.width/2,y:img.height/2,w:img.width/2,h:img.height/2},
        {x:img.width*0.25,y:img.height*0.25,w:img.width*0.5,h:img.height*0.5}
      ];
      let votes=[],i=0;
      function next(){
        if(i>=regs.length){
          const pv=votes.filter(v=>'pure'===v).length,
                sv=votes.length-pv,
                isPure=pv>sv,
                conf=Math.max(pv,sv)/votes.length,
                label=isPure?'Pure Milk':'Adulterated Milk';
          document.getElementById('result').innerHTML=`
            <div id="report" class="card shadow-sm">
             <div class="card-body">
               <h5 class="card-title text-${isPure?'success':'danger'}">${label}</h5>
               <p><strong>Test:</strong> ${name}</p>
               <p><strong>Confidence:</strong> ${(conf*100).toFixed(1)}%</p>
               <div><strong>Strip Photo:</strong><br>
                 <img src="${URL.createObjectURL(f)}" style="max-width:100%;margin-top:.5rem">
               </div>
             </div>
            </div>`;
          document.getElementById('btnPDF').style.display='block';
          return;
        }
        const r=regs[i++],
              c=document.createElement('canvas'),
              ctx=c.getContext('2d');
        c.width=r.w; c.height=r.h;
        ctx.drawImage(full,r.x,r.y,r.w,r.h,0,0,r.w,r.h);
        computeProfile(c,prof=>{
          const dP=Math.hypot(prof.h-calib.pure.h,prof.s-calib.pure.s),
                dS=Math.hypot(prof.h-calib.salt.h,prof.s-calib.salt.s);
          votes.push(dP<dS?'pure':'salt');
          next();
        });
      }
      next();
    };
    img.src=URL.createObjectURL(f);
  };

  // PDF
  document.getElementById('btnPDF').onclick=()=>{
    html2canvas(document.getElementById('report')).then(canvas=>{
      const imgData=canvas.toDataURL('image/png'),
            pdf=new jsPDF({unit:'pt',format:'a4'}),
            w=pdf.internal.pageSize.getWidth(),
            h=canvas.height*w/canvas.width;
      pdf.addImage(imgData,'PNG',0,0,w,h);
      pdf.save('test_report.pdf');
    });
  };
  </script>
</body>
</html>
