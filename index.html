<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Everest Secura Test</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <style>
    body { padding-top:56px; background:#f8f9fa; }
    #testingCard { opacity:.5; pointer-events:none; }
    .swatch { width:40px; height:40px; border:1px solid #ddd; border-radius:4px; display:inline-block; vertical-align:middle; margin-right:.5rem; }
    .btn-file { margin-right:.5rem; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand">Everest Secura Test</span>
    </div>
  </nav>

  <div class="container py-4">

    <!-- Calibration Card -->
    <div class="card mb-4">
      <div class="card-header">Calibration (Step 1 of 2)</div>
      <div class="card-body">

        <!-- Pure Strip Options -->
        <div class="mb-3">
          <label class="form-label">“Pure” Reference Strip</label><br>
          <button id="btnPureCam" class="btn btn-outline-primary btn-file">
            <i class="fas fa-camera"></i> Capture
          </button>
          <button id="btnPureGal" class="btn btn-outline-secondary btn-file">
            <i class="fas fa-image"></i> Gallery
          </button>
          <span id="pureLabel">No file chosen</span>
          <!-- hidden inputs -->
          <input id="pureCam" type="file" accept="image/*" capture="environment" style="display:none">
          <input id="pureGal" type="file" accept="image/*" style="display:none">
        </div>

        <!-- Salted Strip Options -->
        <div class="mb-3">
          <label class="form-label">“Adulterated” Reference Strip</label><br>
          <button id="btnSaltCam" class="btn btn-outline-primary btn-file">
            <i class="fas fa-camera"></i> Capture
          </button>
          <button id="btnSaltGal" class="btn btn-outline-secondary btn-file">
            <i class="fas fa-image"></i> Gallery
          </button>
          <span id="saltLabel">No file chosen</span>
          <!-- hidden inputs -->
          <input id="saltCam" type="file" accept="image/*" capture="environment" style="display:none">
          <input id="saltGal" type="file" accept="image/*" style="display:none">
        </div>

        <button id="btnCal" class="btn btn-primary w-100">
          Save Calibration &amp; Unlock Testing
        </button>
      </div>
    </div>

    <!-- Testing Card -->
    <div id="testingCard" class="card mb-4">
      <div class="card-header">Testing (Step 2 of 2)</div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Test Name (optional)</label>
          <input id="testName" type="text" class="form-control" placeholder="e.g. Sample A">
        </div>
        <div class="mb-3">
          <label class="form-label">Capture / Select Strip</label>
          <input id="testImg" type="file" accept="image/*" capture="environment" class="form-control">
        </div>
        <div id="result" class="mt-3"></div>
      </div>
    </div>

  </div>

  <!-- FontAwesome & Service Worker & Logic -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script>
  // register SW
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  // RGB→HSV, gray-world WB, centre-ROI
  function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255;
    let mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, s=mx?d/mx:0;
    if(d){switch(mx){case r:h=((g-b)/d+(g<b?6:0));break;case g:h=((b-r)/d+2);break;case b:h=((r-g)/d+4);break;}h/=6;}
    return [h*360,s];
  }
  function whiteBalance(p){let sum=[0,0,0],n=p.length/4;for(let i=0;i<p.length;i+=4){sum[0]+=p[i];sum[1]+=p[i+1];sum[2]+=p[i+2];}
    let avg=sum.map(x=>x/n),gray=(avg[0]+avg[1]+avg[2])/3,g=avg.map(x=>gray/x);
    for(let i=0;i<p.length;i+=4){p[i]*=g[0];p[i+1]*=g[1];p[i+2]*=g[2];}
  }
  function computeProfile(file,cb){
    let img=new Image();
    img.onload=()=>{
      let cw=img.width*.5,ch=img.height*.5,sx=(img.width-cw)/2,sy=(img.height-ch)/2;
      let c=document.createElement('canvas'),ctx=c.getContext('2d');
      c.width=cw;c.height=ch;ctx.drawImage(img,sx,sy,cw,ch,0,0,cw,ch);
      let d=ctx.getImageData(0,0,cw,ch).data;whiteBalance(d);
      let hSum=0,sSum=0,cnt=0;
      for(let i=0;i<d.length;i+=4){let [h,s]=rgbToHsv(d[i],d[i+1],d[i+2]);hSum+=h;sSum+=s;cnt++;}
      cb({h:hSum/cnt,s:sSum/cnt});
    };
    img.src=URL.createObjectURL(file);
  }

  let pureFile=null, saltFile=null, calib=null;

  // hookup pure inputs
  for(const type of ['Cam','Gal']){
    document.getElementById('btnPure'+type).onclick = ()=> document.getElementById('pure'+type).click();
    document.getElementById('pure'+type).onchange = e=>{
      pureFile = e.target.files[0];
      document.getElementById('pureLabel').textContent = pureFile.name;
    };
  }
  // hookup salt inputs
  for(const type of ['Cam','Gal']){
    document.getElementById('btnSalt'+type).onclick = ()=> document.getElementById('salt'+type).click();
    document.getElementById('salt'+type).onchange = e=>{
      saltFile = e.target.files[0];
      document.getElementById('saltLabel').textContent = saltFile.name;
    };
  }

  // Save Calibration
  document.getElementById('btnCal').onclick = ()=>{
    if(!pureFile||!saltFile) return alert('Use Camera or Gallery to pick BOTH strips.');
    computeProfile(pureFile, pure=>{
      computeProfile(saltFile, salt=>{
        calib={pure,salt};
        localStorage.setItem('calib',JSON.stringify(calib));
        let tc=document.getElementById('testingCard');
        tc.style.opacity='1'; tc.style.pointerEvents='auto';
        alert('Calibration saved – now run your tests.');
      });
    });
  };

  // restore on load
  window.addEventListener('load',()=>{
    let st=localStorage.getItem('calib');
    if(st){ calib=JSON.parse(st);
      let tc=document.getElementById('testingCard');
      tc.style.opacity='1'; tc.style.pointerEvents='auto';
    }
  });

  // Testing
  document.getElementById('testImg').onchange = e=>{
    let f=e.target.files[0];
    if(!f||!calib) return;
    let name=document.getElementById('testName').value||'—';
    computeProfile(f, test=>{
      let dP=Math.hypot(test.h-calib.pure.h,test.s-calib.pure.s),
          dS=Math.hypot(test.h-calib.salt.h,test.s-calib.salt.s),
          isPure=dP<dS, conf=Math.abs(dS-dP)/(dS+dP),
          label=isPure?'Pure Milk':'Adulterated Milk';
      document.getElementById('result').innerHTML=`
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-${isPure?'success':'danger'}">${label}</h5>
            <p class="card-text"><strong>Test:</strong> ${name}</p>
            <p class="card-text"><strong>Confidence:</strong> ${(conf*100).toFixed(1)}%</p>
          </div>
        </div>`;
    });
  };
  </script>
</body>
</html>
