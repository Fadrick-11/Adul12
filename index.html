<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Everest Secura Test</title>

  <!-- PWA meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body { padding-top: 56px; background: #f8f9fa; }
    .swatch {
      width:40px; height:40px;
      border:1px solid #ddd;
      border-radius:4px;
      display:inline-block;
      vertical-align:middle;
      margin-right:.5rem;
    }
    #testingCard {
      opacity:.5;
      pointer-events:none;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand">Everest Secura Test</span>
    </div>
  </nav>

  <div class="container py-4">

    <!-- Calibration -->
    <div class="card mb-4">
      <div class="card-header">Calibration (Step 1 of 2)</div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">“Pure” Reference Strip</label>
          <input
            id="pureImg"
            type="file"
            accept="image/*"
            capture="environment"
            class="form-control"
          >
        </div>
        <div class="mb-3">
          <label class="form-label">“Adulterated” Reference Strip</label>
          <input
            id="saltImg"
            type="file"
            accept="image/*"
            capture="environment"
            class="form-control"
          >
        </div>
        <button id="btnCal" class="btn btn-primary w-100">
          Save Calibration &amp; Unlock Testing
        </button>
      </div>
    </div>

    <!-- Testing -->
    <div id="testingCard" class="card mb-4">
      <div class="card-header">Testing (Step 2 of 2)</div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Test Name (optional)</label>
          <input id="testName" type="text" class="form-control" placeholder="e.g. Sample A">
        </div>
        <div class="mb-3">
          <label class="form-label">Capture / Select Strip</label>
          <input
            id="testImg"
            type="file"
            accept="image/*"
            capture="environment"
            class="form-control"
          >
        </div>
        <div id="result" class="mt-3"></div>
      </div>
    </div>

  </div>

  <script>
  // register SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  // RGB→HSV
  function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255;
    let mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, s=mx?d/mx:0, v=mx;
    if(d){
      switch(mx){
        case r: h=((g-b)/d + (g<b?6:0)); break;
        case g: h=((b-r)/d + 2); break;
        case b: h=((r-g)/d + 4); break;
      }
      h/=6;
    }
    return [h*360,s,v];
  }

  // Gray-world white-balance
  function whiteBalance(pix){
    let sum=[0,0,0], n=pix.length/4;
    for(let i=0;i<pix.length;i+=4){
      sum[0]+=pix[i]; sum[1]+=pix[i+1]; sum[2]+=pix[i+2];
    }
    let avg=sum.map(x=>x/n), gray=(avg[0]+avg[1]+avg[2])/3;
    let gains=avg.map(x=>gray/x);
    for(let i=0;i<pix.length;i+=4){
      pix[i]*=gains[0];
      pix[i+1]*=gains[1];
      pix[i+2]*=gains[2];
    }
  }

  // Compute average H/S over central 50% ROI
  function computeProfile(file, cb){
    let img = new Image();
    img.onload = ()=>{
      // sample centre-box
      let cw = img.width * 0.5, ch = img.height * 0.5;
      let sx = (img.width - cw)/2, sy = (img.height - ch)/2;
      let c = document.createElement('canvas'), ctx = c.getContext('2d');
      c.width = cw; c.height = ch;
      ctx.drawImage(img, sx, sy, cw, ch, 0, 0, cw, ch);
      let data = ctx.getImageData(0,0,cw,ch).data;
      whiteBalance(data);
      let hSum=0, sSum=0, cnt=0;
      for(let i=0;i<data.length;i+=4){
        let [h,s] = rgbToHsv(data[i], data[i+1], data[i+2]);
        hSum += h; sSum += s; cnt++;
      }
      cb({ h: hSum/cnt, s: sSum/cnt });
    };
    img.src = URL.createObjectURL(file);
  }

  let calib = null;

  // Calibration button
  document.getElementById('btnCal').onclick = ()=>{
    let p = document.getElementById('pureImg').files[0],
        s = document.getElementById('saltImg').files[0];
    if(!p||!s) return alert('Please capture or select BOTH reference strips.');
    computeProfile(p, pure=>{
      computeProfile(s, salt=>{
        calib = { pure, salt };
        localStorage.setItem('calib', JSON.stringify(calib));
        let tc = document.getElementById('testingCard');
        tc.style.opacity = '1';
        tc.style.pointerEvents = 'auto';
        alert('Calibration saved – you may now run tests.');
      });
    });
  };

  // restore calibration on load
  window.addEventListener('load', ()=>{
    let stored = localStorage.getItem('calib');
    if(stored){
      calib = JSON.parse(stored);
      let tc = document.getElementById('testingCard');
      tc.style.opacity = '1';
      tc.style.pointerEvents = 'auto';
    }
  });

  // Testing handler
  document.getElementById('testImg').onchange = e=>{
    let f = e.target.files[0];
    if(!f||!calib) return;
    let testName = document.getElementById('testName').value.trim() || '—';
    computeProfile(f, test=>{
      let dP = Math.hypot(test.h - calib.pure.h,   test.s - calib.pure.s),
          dS = Math.hypot(test.h - calib.salt.h,   test.s - calib.salt.s),
          isPure = dP < dS,
          conf   = Math.abs(dS - dP)/(dS + dP),
          label  = isPure ? 'Pure Milk' : 'Adulterated Milk';

      document.getElementById('result').innerHTML = `
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-${isPure?'success':'danger'}">
              ${label}
            </h5>
            <p class="card-text"><strong>Test:</strong> ${testName}</p>
            <p class="card-text"><strong>Confidence:</strong> ${(conf*100).toFixed(1)}%</p>
          </div>
        </div>`;
    });
  };
  </script>
</body>
</html>
